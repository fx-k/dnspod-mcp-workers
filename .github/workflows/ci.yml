name: DNSPod v3 验收
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 安装构建工具（不传云凭据）
        run: npm install --no-audit --no-fund
      - name: JavaScript 语法检查
        run: npm run check
      - name: 参数、TC3、MCP、OAuth 与权限回归测试
        run: npm test
      - name: JSON Schema 元结构验收
        run: |
          python -m pip install jsonschema==4.23.0
          python scripts/check-schemas.py
      - name: Cloudflare 构建验证（不部署）
        run: npm run build
      - name: 本地 workerd 与 SQLite Durable Object 端到端验收
        run: npm run test:worker
