# v3：使用 SQLite Durable Object 原子消费 OAuth 状态；无需创建 KV。
# 从 v2 升级后需要重新 OAuth 授权，不删除旧 KV 数据。
name = "dnspod-mcp"
main = "src/index.js"
compatibility_date = "2026-07-01"
workers_dev = true

[vars]
DNSPOD_READ_ONLY = "true"
DNSPOD_ALLOW_DESTRUCTIVE = "false"
DNSPOD_WRITE_DOMAINS = ""
# ChatGPT OAuth/token/MCP 浏览器请求可能携带 Origin；仅允许精确来源，不要改成 *。
CORS_ALLOWED_ORIGINS = "https://chatgpt.com"

[[durable_objects.bindings]]
name = "OAUTH_STATE"
class_name = "OAuthState"

[[migrations]]
tag = "v3-oauth-sqlite"
new_sqlite_classes = ["OAuthState"]
